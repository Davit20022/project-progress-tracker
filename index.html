<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">

<title>Project Progress Tracker</title>

<style>
:root {
  --bg:#f5f7fb;
  --card:#ffffff;
  --soft:#f3f5f9;
  --text:#172033;
  --muted:#687386;
  --line:#e2e7ef;
  --primary:#5b5ce2;
  --green:#159b63;
  --amber:#d97706;
  --red:#dc3545;
  --todo:#64748b;
  --shadow:0 10px 30px rgba(15,23,42,.07);
}

body.dark {
  --bg:#0d1118;
  --card:#171c25;
  --soft:#111721;
  --text:#edf2f7;
  --muted:#9aa6b8;
  --line:#2a3341;
  --primary:#8182ff;
  --green:#36c98a;
  --amber:#f4ad45;
  --red:#ff6b78;
  --todo:#8996a9;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}

button,
input,
select {
  font:inherit;
}

button {
  cursor:pointer;
}

button:disabled {
  cursor:not-allowed;
}

.hidden {
  display:none !important;
}

/* APP */

.app {
  width:min(1050px,calc(100% - 28px));
  margin:auto;
  padding:22px 0 45px;
}

/* TOP BAR */

.topbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}

.brand {
  font-size:17px;
  font-weight:850;
}

.brand small {
  display:block;
  margin-top:2px;
  color:var(--muted);
  font-size:11px;
  font-weight:500;
}

.actions {
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.btn,
.icon-btn,
.mini {
  min-height:36px;
  padding:0 12px;
  color:var(--text);
  background:var(--card);
  border:1px solid var(--line);
  border-radius:9px;
  font-weight:750;
  transition:
    color .15s,
    border-color .15s,
    background .15s,
    transform .15s;
}

.btn:hover:not(:disabled),
.icon-btn:hover:not(:disabled),
.mini:hover:not(:disabled) {
  border-color:var(--primary);
}

.btn.primary {
  color:white;
  background:var(--primary);
  border-color:var(--primary);
}

.icon-btn {
  width:38px;
  padding:0;
}

.mini {
  min-height:31px;
  padding:0 10px;
  color:var(--muted);
  font-size:12px;
}

.mini:hover {
  color:var(--text);
}

/* HERO */

.hero,
.workspace,
.stat {
  background:var(--card);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
}

.hero {
  margin-top:18px;
  padding:25px;
  border-radius:18px;
}

.hero-top {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}

.eyebrow {
  margin:0 0 6px;
  color:var(--primary);
  font-size:11px;
  font-weight:850;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.title-line {
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:7px;
}

.title-line h1 {
  margin:0;
  font-size:clamp(25px,4vw,38px);
  letter-spacing:-.03em;
}

.title-edit-actions {
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:8px;
}

.subtitle {
  max-width:650px;
  margin:8px 0 12px;
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.viewer-badge {
  display:inline-block;
  padding:6px 9px;
  color:var(--green);
  background:rgba(21,155,99,.12);
  border-radius:999px;
  font-size:11px;
  font-weight:800;
}

.score {
  min-width:125px;
  padding:13px;
  text-align:center;
  background:var(--soft);
  border-radius:13px;
}

.score strong {
  display:block;
  color:var(--primary);
  font-size:27px;
}

.score span {
  color:var(--muted);
  font-size:11px;
}

/* PROJECT PROGRESS DISPLAY */

.bar {
  height:10px;
  margin-top:20px;
  overflow:hidden;
  background:var(--soft);
  border:1px solid var(--line);
  border-radius:999px;
}

.bar > div {
  width:0;
  height:100%;
  background:linear-gradient(90deg,#4f51df,#7187ff);
  transition:width .3s;
}

.status {
  margin-top:9px;
  color:var(--muted);
  font-size:10px;
}

.status.error {
  color:var(--red);
}

/* STATS */

.stats {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:12px;
}

.stat {
  padding:13px;
  border-radius:13px;
}

.stat strong {
  display:block;
  font-size:21px;
}

.stat span {
  color:var(--muted);
  font-size:11px;
}

/* WORKSPACE */

.workspace {
  margin-top:12px;
  padding:17px;
  border-radius:17px;
}

.workspace-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.workspace h2 {
  margin:0;
  font-size:18px;
}

.workspace p {
  margin:4px 0 0;
  color:var(--muted);
  font-size:11px;
}

/* FILTER BAR */

.filters {
  display:flex;
  align-items:center;
  gap:6px;
  padding:4px;
  margin:14px 0;
  overflow-x:auto;
  overflow-y:hidden;
  background:var(--soft);
  border-radius:10px;
  scrollbar-width:thin;
  -webkit-overflow-scrolling:touch;
}

.filter {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  flex:1 0 auto;
  min-width:max-content;
  min-height:35px;
  padding:0 11px;
  color:var(--muted);
  background:transparent;
  border:0;
  border-radius:7px;
  font-size:12px;
  font-weight:750;
  white-space:nowrap;
}

.filter.active {
  color:var(--text);
  background:var(--card);
  box-shadow:0 2px 7px rgba(0,0,0,.06);
}

.filter
