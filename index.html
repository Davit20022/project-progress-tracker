<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Project Progress Tracker</title>

<style>
:root {
  --bg:#f5f7fb;
  --card:#ffffff;
  --soft:#f3f5f9;
  --text:#172033;
  --muted:#687386;
  --line:#e2e7ef;
  --primary:#5b5ce2;
  --green:#159b63;
  --red:#dc3545;
  --amber:#d97706;
  --todo:#64748b;
  --shadow:0 10px 30px rgba(15,23,42,.07);
}

body.dark {
  --bg:#0d1118;
  --card:#171c25;
  --soft:#111721;
  --text:#edf2f7;
  --muted:#9aa6b8;
  --line:#2a3341;
  --primary:#8182ff;
  --green:#36c98a;
  --red:#ff6b78;
  --amber:#f4ad45;
  --todo:#77859a;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}

button,
input,
select {
  font:inherit;
}

button {
  cursor:pointer;
}

.hidden {
  display:none !important;
}

.app {
  width:min(1120px,calc(100% - 28px));
  margin:auto;
  padding:24px 0 50px;
}

.topbar,
.hero-top,
.task-top {
  display:flex;
  align-items:center;
}

.topbar,
.hero-top {
  justify-content:space-between;
  gap:16px;
}

.brand {
  font-size:17px;
  font-weight:850;
}

.brand small {
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:12px;
  font-weight:500;
}

.actions {
  display:flex;
  gap:9px;
}

.btn,
.icon-btn {
  min-height:41px;
  padding:0 14px;
  color:var(--text);
  background:var(--card);
  border:1px solid var(--line);
  border-radius:11px;
  font-weight:750;
}

.btn.primary {
  color:white;
  background:var(--primary);
  border-color:var(--primary);
}

.btn.danger {
  color:white;
  background:var(--red);
  border-color:var(--red);
}

.icon-btn {
  width:42px;
  padding:0;
}

.hero,
.workspace,
.stat {
  background:var(--card);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
}

.hero {
  margin-top:20px;
  padding:32px;
  border-radius:23px;
}

.eyebrow {
  margin:0 0 8px;
  color:var(--primary);
  font-size:12px;
  font-weight:850;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.title-line {
  display:flex;
  align-items:center;
  gap:8px;
}

.title-line h1 {
  margin:0;
  font-size:clamp(27px,4vw,42px);
  letter-spacing:-.04em;
}

.subtitle {
  max-width:680px;
  color:var(--muted);
  line-height:1.6;
}

.score {
  min-width:140px;
  padding:16px;
  text-align:center;
  background:var(--soft);
  border-radius:16px;
}

.score strong {
  display:block;
  color:var(--primary);
  font-size:30px;
}

.score span {
  color:var(--muted);
  font-size:12px;
}

.bar {
  height:14px;
  margin-top:25px;
  overflow:hidden;
  background:var(--soft);
  border:1px solid var(--line);
  border-radius:999px;
}

.bar > div {
  width:0;
  height:100%;
  background:linear-gradient(90deg,#4f51df,#7187ff);
  transition:width .35s;
}

.stats {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:13px;
  margin-top:16px;
}

.stat {
  padding:17px;
  border-radius:16px;
}

.stat strong {
  display:block;
  font-size:25px;
}

.stat span {
  color:var(--muted);
  font-size:12px;
}

.workspace {
  margin-top:16px;
  padding:21px;
  border-radius:21px;
}

.workspace-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.workspace h2 {
  margin:0;
  font-size:20px;
}

.workspace p {
  color:var(--muted);
  font-size:13px;
}

/* FILTERS */

.filters {
  display:flex;
  gap:6px;
  padding:5px;
  margin:18px 0;
  overflow:auto;
  background:var(--soft);
  border-radius:12px;
}

.filter {
  padding:8px 12px;
  color:var(--muted);
  background:transparent;
  border:0;
  border-radius:8px;
  font-weight:750;
  white-space:nowrap;
}

.filter.active {
  color:var(--text);
  background:var(--card);
  box-shadow:0 2px 8px rgba(0,0,0,.07);
}

/* TASKS */

.tasks {
  display:grid;
  gap:11px;
}

.task {
  padding:17px;
  border:1px solid var(--line);
  border-radius:15px;
  transition:.2s ease;
}

.task.done {
  background:rgba(21,155,99,.08);
  border-color:rgba(21,155,99,.25);
}

.task-top {
  align-items:flex-start;
  gap:12px;
}

.task-status-icon {
  width:26px;
  height:26px;
  flex:0 0 26px;
  display:grid;
  place-items:center;
  border:1px solid var(--line);
  border-radius:7px;
  color:var(--muted);
  background:var(--soft);
  font-size:14px;
  font-weight:900;
}

.task.done .task-status-icon {
  color:white;
  background:var(--green);
  border-color:var(--green);
}

.task-body {
  flex:1;
}

.task-name {
  font-weight:800;
}

.done .task-name {
  color:var(--muted);
  text-decoration:line-through;
}

.meta {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:7px;
  color:var(--muted);
  font-size:12px;
}

.tag {
  padding:4px 8px;
  border-radius:999px;
  font-weight:800;
}

.tag.low {
  color:var(--green);
  background:rgba(21,155,99,.12);
}

.tag.medium {
  color:var(--amber);
  background:rgba(217,119,6,.12);
}

.tag.high {
  color:var(--red);
  background:rgba(220,53,69,.12);
}

.task-actions {
  display:flex;
  gap:6px;
}

.mini {
  padding:7px 9px;
  color:var(--muted);
  background:var(--card);
  border:1px solid var(--line);
  border-radius:8px;
}

/* STATUS BUTTONS */

.status-control {
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:16px;
  padding-top:14px;
  border-top:1px solid var(--line);
}

.status-label {
  color:var(--muted);
  font-size:12px;
  font-weight:800;
}

.status-buttons {
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.status-btn {
  min-height:36px;
  padding:0 13px;
  color:var(--muted);
  background:var(--soft);
  border:1px solid var(--line);
  border-radius:9px;
  font-size:12px;
  font-weight:800;
  transition:
    background .2s,
    color .2s,
    border-color .2s,
    transform .15s;
}

.status-btn:hover:not(:disabled) {
  transform:translateY(-1px);
  color:var(--text);
}

.status-btn.todo:hover:not(:disabled) {
  border-color:var(--todo);
}

.status-btn.progress:hover:not(:disabled) {
  border-color:var(--amber);
}

.status-btn.completed:hover:not(:disabled) {
  border-color:var(--green);
}

.status-btn.active {
  color:white;
}

.status-btn.todo.active {
  background:var(--todo);
  border-color:var(--todo);
}

.status-btn.progress.active {
  background:var(--amber);
  border-color:var(--amber);
}

.status-btn.completed.active {
  background:var(--green);
  border-color:var(--green);
}

.status-btn:disabled {
  cursor:default;
}

.status-btn:disabled:not(.active) {
  opacity:.45;
}

.empty {
  padding:46px 15px;
  color:var(--muted);
  text-align:center;
  background:var(--soft);
  border-radius:14px;
}

.status {
  margin-top:12px;
  color:var(--muted);
  font-size:12px;
}

.status.error {
  color:var(--red);
}

.viewer-badge {
  display:inline-block;
  padding:7px 10px;
  color:var(--green);
  background:rgba(21,155,99,.12);
  border-radius:999px;
  font-size:12px;
  font-weight:800;
}

/* MODAL */

.modal-bg {
  position:fixed;
  inset:0;
  z-index:20;
  display:none;
  place-items:center;
  padding:18px;
  background:rgba(7,11,20,.62);
}

.modal-bg.open {
  display:grid;
}

.modal {
  width:min(500px,100%);
  max-height:calc(100vh - 36px);
  padding:22px;
  overflow:auto;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:0 30px 80px rgba(0,0,0,.3);
}

.modal h2 {
  margin:0 0 6px;
}

.modal > p,
.login-note {
  color:var(--muted);
  font-size:13px;
  line-height:1.55;
}

.field {
  margin-top:14px;
}

.field label {
  display:block;
  margin-bottom:6px;
  font-size:12px;
  font-weight:800;
}

.field input,
.field select {
  width:100%;
  min-height:44px;
  padding:0 12px;
  color:var(--text);
  background:var(--soft);
  border:1px solid var(--line);
  border-radius:10px;
}

.modal-actions {
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:20px;
}

.title-input {
  width:min(620px,100%);
  min-height:45px;
  padding:0 11px;
  color:var(--text);
  background:var(--soft);
  border:1px solid var(--primary);
  border-radius:10px;
  font-size:24px;
  font-weight:800;
}

.toast {
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:30;
  max-width:340px;
  padding:12px 14px;
  background:var(--card);
  border:1px solid var(--line);
  border-left:4px solid var(--primary);
  border-radius:11px;
  box-shadow:var(--shadow);
}

@media(max-width:760px) {
  .stats {
    grid-template-columns:repeat(2,1fr);
  }

  .hero-top {
    align-items:flex-start;
